name: Pull Requests

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false

jobs:
  PullRequests:
    name: Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      # The key that used to be read here, SUPER_RESOURCE_KEY, is refused by
      # the cloud because the licence behind it is no longer active, so
      # every cloud test failed. See 51Degrees/internal-common-ci#12.
      TestResourceKey: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
      StrongNameKeyBase64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
